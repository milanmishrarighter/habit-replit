name: Build Iso Hoops APK

on:
  push:
    paths:
      - 'iso-hoops/**'
      - '.github/workflows/iso-hoops-apk.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: iso-hoops
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Sync web assets into the Android project
        run: npx cap sync android

      - name: Build debug APK
        run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: iso-hoops-debug-apk
          path: iso-hoops/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
