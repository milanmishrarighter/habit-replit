name: Build Iso Hoops APK

on:
  push:
    paths:
      - 'iso-hoops/**'
      - '.github/workflows/iso-hoops-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: iso-hoops
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The ubuntu runner already ships the Android SDK; android-actions/setup-android
      # fails trying to install the long-obsolete 'tools' package.
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install dependencies
        run: npm install

      - name: Sync web assets into the Android project
        run: npx cap sync android

      - name: Build debug APK
        run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: iso-hoops-debug-apk
          path: iso-hoops/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Artifacts can only be downloaded while signed in to GitHub; a release
      # asset gives a plain download link that works on a phone.
      - name: Publish APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          gh release delete iso-hoops-latest --yes --cleanup-tag || true
          gh release create iso-hoops-latest "$APK" \
            --title "Iso Hoops (latest debug build)" \
            --notes "Debug APK for Iso Hoops, built from ${{ github.sha }}. Download app-debug.apk, open it on an Android phone and allow installing from unknown sources." \
            --prerelease \
            --target ${{ github.sha }}
