<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#12213E">
<title>Iso Hoops</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#12213E;
    font-family:Archivo,'Segoe UI',system-ui,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  #stage{position:fixed;inset:0;touch-action:none}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  .hud{position:fixed;pointer-events:none;color:#F7F4EC}
  #score{top:calc(env(safe-area-inset-top,0px) + 14px);left:calc(env(safe-area-inset-left,0px) + 16px)}
  #score .n{font-size:52px;font-weight:900;line-height:.92;color:#E8681F;
    letter-spacing:-1px}
  #score .s{margin-top:2px;font-size:13px;font-weight:700;color:#12213E;
    background:#F7F4EC;border-radius:999px;padding:2px 9px;display:inline-block}
  #stage-pill{top:calc(env(safe-area-inset-top,0px) + 16px);right:calc(env(safe-area-inset-right,0px) + 16px);
    text-align:right}
  #stage-pill .p{font-size:12px;font-weight:900;letter-spacing:.8px;text-transform:uppercase;
    background:#E8681F;border-radius:999px;padding:5px 11px;display:inline-block;color:#12213E}
  #hint{top:calc(env(safe-area-inset-top,0px) + 60px);left:0;right:0;text-align:center;
    transition:opacity .45s}
  #hint span{font-size:12.5px;font-weight:700;background:#F7F4EC;color:#12213E;
    border-radius:999px;padding:6px 14px;display:inline-block}
  #hint.gone{opacity:0}

  /* ---- control panel: sliders + buttons, no touch-drag on the court ---- */
  #panel{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(env(safe-area-inset-bottom,0px) + 12px);
    background:linear-gradient(to top, rgba(9,15,29,.97), rgba(9,15,29,.90));
    display:flex;flex-direction:column;gap:9px;z-index:4}
  .row{display:flex;align-items:center;gap:8px}
  .row label{width:56px;flex:0 0 auto;font-size:11.5px;font-weight:900;letter-spacing:.5px;
    color:#F7F4EC;text-transform:uppercase}
  .stepbtn{width:32px;height:32px;flex:0 0 auto;border-radius:9px;border:none;
    background:#1E52C7;color:#F7F4EC;font-size:17px;font-weight:900;line-height:1;
    display:flex;align-items:center;justify-content:center}
  .stepbtn:active{background:#163d99}
  input[type=range]{flex:1 1 auto;height:34px;-webkit-appearance:none;background:transparent}
  input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:5px;background:#22315a}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;
    background:#E8681F;border:3px solid #F7F4EC;margin-top:-9px}
  .readout{width:48px;flex:0 0 auto;text-align:right;font-size:13px;font-weight:900;color:#F7F4EC}
  #shootBtn{width:100%;height:52px;border:none;border-radius:14px;
    background:#E8681F;color:#F7F4EC;font-size:18px;font-weight:900;letter-spacing:1px;
    text-transform:uppercase}
  #shootBtn:active{transform:translateY(2px)}
  #shootBtn:disabled{background:#3c4460;color:#8188a0}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>
<div class="hud" id="score"><div class="n" id="scoreN">0</div><div class="s" id="scoreS">0 / 0</div></div>
<div class="hud" id="stage-pill"><div class="p" id="stageP">STAGE 1 · STATIC</div></div>
<div class="hud" id="hint"><span>Dial in the aim &amp; power, then Shoot</span></div>

<div id="panel">
  <div class="row">
    <label>Aim</label>
    <button class="stepbtn" id="aimDown">&#8249;</button>
    <input type="range" id="aimSlider" min="-180" max="180" step="1" value="0">
    <button class="stepbtn" id="aimUp">&#8250;</button>
    <div class="readout" id="aimReadout">0°</div>
  </div>
  <div class="row">
    <label>Power</label>
    <button class="stepbtn" id="powDown">&minus;</button>
    <input type="range" id="powSlider" min="0" max="200" step="1" value="110">
    <button class="stepbtn" id="powUp">&#43;</button>
    <div class="readout" id="powReadout">55%</div>
  </div>
  <button id="shootBtn">Shoot</button>
</div>

<script>
(function(){
"use strict";

/* ---------------- constants ---------------- */
const YAW = 26 * Math.PI/180, PITCH = 0.52;
const CY = Math.cos(YAW), SY = Math.sin(YAW);
const G = 32.17, DT = 1/240;
// A 48deg launch reaches 10ft only at its apex from anywhere inside ~36ft, so
// every shot arrived flat and clanged off the rim. 70deg puts the apex well
// above the ring and gives a ~55deg entry, which the ball actually fits through.
const LAUNCH_DEG = 70;
const LAUNCH = LAUNCH_DEG * Math.PI/180;
// Power slider runs 0-200%: 100% is the speed a made shot actually needs from
// a typical distance, the extra headroom above and below gives real range to
// undershoot or bomb it from way downtown.
const MAX_SPEED = 34;

const RIM_R = 0.75, RIM_Z = 10, BALL_R = 0.39;
const BB_W = 6, BB_H = 3.5, BB_OFF = 1.25;
const SCORE_KEY_R = 8, SCORE_ARC_R = 23.75;

// No court, no boundary lines: an infinite navy canvas with a faint lattice
// and a warm evening-sun glow in one corner. No white strokes, no drop shadows.
const COL = {
  bg:'#12213E', grid:'rgba(255,255,255,.055)',
  ball:'#E8681F', ballDark:'#B8460F', seam:'#12213E',
  net:'rgba(200,214,255,.55)', rim:'#E8681F', rimDark:'#B8460F',
  board:'#1E3A73', boardEdge:'#E8681F',
  sun:'rgba(255,196,102,.16)'
};
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------------- canvas / camera ---------------- */
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W=0,H=0,DPR=1,S=40,camX=0,camY=0;

function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 3);
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  S = Math.min(W,H) * 0.042;
  centerCamera(focus.x, focus.y);
}
function proj(x,y,z){
  const rx = x*CY - y*SY, ry = x*SY + y*CY;
  return [rx*S + camX, ry*S*PITCH - z*S + camY];
}
// The camera just recenters on the midpoint of the ball and hoop each round —
// there's no court to frame against, so the "framing" is always the play.
const focus = {x:0,y:14};
function centerCamera(fx,fy){
  focus.x=fx; focus.y=fy;
  const rx = fx*CY - fy*SY, ry = (fx*SY + fy*CY)*PITCH;
  camX = W/2 - rx*S;
  camY = H*0.36 - ry*S;
}

/* ---------------- hoop (moving target) ---------------- */
const hoop = {
  cx:0, cy:14, cz:RIM_Z, yaw:0, tilt:0, driftAmp:0, driftPhase:0, t:0, baseX:0, baseY:14,
  u:[1,0,0], v:[0,1,0], n:[0,0,1]
};
function hoopUpdate(dt){
  hoop.t += dt;
  const drift = hoop.driftAmp ? Math.sin(hoop.t*0.9 + hoop.driftPhase)*hoop.driftAmp : 0;
  hoop.cx = hoop.baseX + drift;
  hoop.cy = hoop.baseY;
  hoop.cz = RIM_Z;
  const c=Math.cos(hoop.yaw), s=Math.sin(hoop.yaw);
  const u=[c,s,0], v0=[-s,c,0], n0=[0,0,1];
  const ct=Math.cos(hoop.tilt), st=Math.sin(hoop.tilt);
  hoop.u=u;
  hoop.v=[v0[0]*ct+n0[0]*st, v0[1]*ct+n0[1]*st, v0[2]*ct+n0[2]*st];
  hoop.n=[-v0[0]*st+n0[0]*ct, -v0[1]*st+n0[1]*ct, -v0[2]*st+n0[2]*ct];
}
function rimPoint(a){
  const co=Math.cos(a), si=Math.sin(a);
  return [hoop.cx + RIM_R*(co*hoop.u[0]+si*hoop.v[0]),
          hoop.cy + RIM_R*(co*hoop.u[1]+si*hoop.v[1]),
          hoop.cz + RIM_R*(co*hoop.u[2]+si*hoop.v[2])];
}
function local(p){
  const d=[p[0]-hoop.cx, p[1]-hoop.cy, p[2]-hoop.cz];
  return [d[0]*hoop.u[0]+d[1]*hoop.u[1]+d[2]*hoop.u[2],
          d[0]*hoop.v[0]+d[1]*hoop.v[1]+d[2]*hoop.v[2],
          d[0]*hoop.n[0]+d[1]*hoop.n[1]+d[2]*hoop.n[2]];
}

/* ---------------- difficulty ---------------- */
const STAGES=[
  {min:0,   name:'STATIC'},
  {min:50,  name:'SHIFTING'},
  {min:80,  name:'YAWING'},
  {min:110, name:'TILTING'},
  {min:140, name:'DRIFTING'}
];
function stageIndex(sc){ let i=0; for(let k=0;k<STAGES.length;k++) if(sc>=STAGES[k].min) i=k; return i; }
function rollHoop(){
  const i = stageIndex(game.score);
  const R = (a)=> (Math.random()*2-1)*a;
  // Placement itself is random every round (below); stages only add the
  // extra dynamic movement on top of wherever it lands.
  hoop.baseX = (Math.random()*2-1)*26;
  hoop.baseY = 8 + Math.random()*30;
  hoop.yaw   = i>=2 ? R(0.26) : 0;
  hoop.tilt  = i>=3 ? R(0.17) : 0;
  hoop.driftAmp = i>=4 ? 4.5  : 0;
  hoop.driftPhase = Math.random()*Math.PI*2;
  document.getElementById('stageP').textContent = 'STAGE '+(i+1)+' · '+STAGES[i].name;
}

/* ---------------- game state ---------------- */
const game = {
  score:0, makes:0, attempts:0,
  ball:{x:0,y:0,z:BALL_R,vx:0,vy:0,vz:0,
        spinAngle:0, spinRate:0, spinPhaseA:0, spinPhaseB:2.09, spinPhaseC:4.19},
  live:false, resetAt:0, spawnPts:2,
  aimDeg:0, power:0.55,
  preview:null, previewLand:null
};

function pointValue(dist){
  if(dist<=SCORE_KEY_R) return 1;
  if(dist<=SCORE_ARC_R) return 2;
  return 3;
}

function spawnBall(){
  rollHoop();
  hoopUpdate(0);
  let x=hoop.cx,y=hoop.cy+10,tries=0;
  while(tries++ < 200){
    const a = Math.random()*Math.PI*2;
    const d = 5 + Math.random()*9;
    const cx = hoop.cx + Math.cos(a)*d;
    const cy = hoop.cy + Math.sin(a)*d;
    if(cy < 1) continue;
    x=cx; y=cy; break;
  }
  const b=game.ball;
  b.x=x; b.y=y; b.z=BALL_R; b.vx=b.vy=b.vz=0; b.spinRate=0;
  game.spawnPts = pointValue(Math.hypot(x-hoop.cx, y-hoop.cy));
  game.live=false; game.resetAt=0;
  centerCamera((x+hoop.cx)/2, (y+hoop.cy)/2);
  shootBtn.disabled=false;
  computePreview();
}

/* ---------------- physics ---------------- */
function stepBall(b, dt, detect){
  b.vz -= G*dt;
  b.x += b.vx*dt; b.y += b.vy*dt; b.z += b.vz*dt;

  // Spin: a real rolling ball turns at speed/radius, which for a 0.39ft ball
  // is dozens of rad/s - way too fast to read as anything but a strobe. Scale
  // it down to something a human eye reads as "spinning", not flickering.
  const targetRate = Math.min(9, Math.hypot(b.vx,b.vy)*0.55);
  b.spinRate += (targetRate-b.spinRate)*Math.min(1,dt*3.2);
  b.spinAngle += b.spinRate*dt;

  // rim ring
  const L = local([b.x,b.y,b.z]);
  const r = Math.hypot(L[0],L[1]);
  if(r > 1e-4){
    const qx = RIM_R*L[0]/r, qy = RIM_R*L[1]/r;
    const dx = L[0]-qx, dy = L[1]-qy, dz = L[2];
    const dist = Math.hypot(dx,dy,dz);
    if(dist < BALL_R && dist > 1e-6){
      const nl=[dx/dist, dy/dist, dz/dist];
      const nw=[ nl[0]*hoop.u[0]+nl[1]*hoop.v[0]+nl[2]*hoop.n[0],
                 nl[0]*hoop.u[1]+nl[1]*hoop.v[1]+nl[2]*hoop.n[1],
                 nl[0]*hoop.u[2]+nl[1]*hoop.v[2]+nl[2]*hoop.n[2] ];
      const pen = BALL_R-dist;
      b.x += nw[0]*pen; b.y += nw[1]*pen; b.z += nw[2]*pen;
      const vn = b.vx*nw[0]+b.vy*nw[1]+b.vz*nw[2];
      if(vn<0){ const j=-(1+0.48)*vn; b.vx+=nw[0]*j; b.vy+=nw[1]*j; b.vz+=nw[2]*j; }
    }
  }

  if(detect && b._pn!==undefined){
    if(b._pn>0 && L[2]<=0 && r < RIM_R - BALL_R*0.45) return 'make';
  }
  b._pn = L[2];

  // backboard plane
  const bu = L[0], bv = L[1], bn = L[2];
  if(bv > -BB_OFF-0.9 && bv < -BB_OFF+BALL_R && Math.abs(bu) < BB_W/2 && bn > -0.6 && bn < BB_H){
    const vv = b.vx*hoop.v[0]+b.vy*hoop.v[1]+b.vz*hoop.v[2];
    if(vv<0){
      const j=-(1+0.55)*vv;
      b.vx+=hoop.v[0]*j; b.vy+=hoop.v[1]*j; b.vz+=hoop.v[2]*j;
      const pen = (-BB_OFF+BALL_R)-bv;
      b.x+=hoop.v[0]*pen; b.y+=hoop.v[1]*pen; b.z+=hoop.v[2]*pen;
    }
  }

  // floor
  if(b.z < BALL_R){
    b.z = BALL_R;
    if(b.vz<0) b.vz = -b.vz*0.58;
    b.vx*=0.82; b.vy*=0.82;
    if(Math.abs(b.vz)<1.6 && Math.hypot(b.vx,b.vy)<1.6){ b.vz=0; b.vx*=0.5; b.vy*=0.5; return 'rest'; }
  }
  return null;
}

/* ---------------- aiming preview (driven by sliders, not touch) ---------------- */
function currentDir(){
  const a = game.aimDeg*Math.PI/180;
  return [Math.cos(a), Math.sin(a)];
}
function launchVector(){
  const dir = currentDir();
  const sp = game.power*MAX_SPEED;
  const h = sp*Math.cos(LAUNCH), z = sp*Math.sin(LAUNCH);
  return [dir[0]*h, dir[1]*h, z];
}
function computePreview(){
  const b=game.ball, v=launchVector();
  const sim={x:b.x,y:b.y,z:b.z,vx:v[0],vy:v[1],vz:v[2]};
  const pts=[]; let land=null;
  for(let i=0;i<240*5;i++){
    stepBall(sim, DT, false);
    if(i%6===0) pts.push([sim.x,sim.y,sim.z]);
    if(!land && sim.z<=BALL_R+0.02 && sim.vz<=0 && i>20) land=[sim.x,sim.y];
    if(land) break;
  }
  game.preview=pts; game.previewLand=land;
}

/* ---------------- controls: sliders + step buttons + shoot ---------------- */
const aimSlider=document.getElementById('aimSlider'), powSlider=document.getElementById('powSlider');
const aimReadout=document.getElementById('aimReadout'), powReadout=document.getElementById('powReadout');
const shootBtn=document.getElementById('shootBtn');
const hint=document.getElementById('hint');
let interacted=false;

function onAimChange(){
  game.aimDeg = +aimSlider.value;
  aimReadout.textContent = game.aimDeg+'°';
  computePreview();
  noteInteract();
}
function onPowChange(){
  game.power = (+powSlider.value)/100;
  powReadout.textContent = powSlider.value+'%';
  computePreview();
  noteInteract();
}
function noteInteract(){ if(!interacted){ interacted=true; hint.classList.add('gone'); } }
function step(slider,delta,handler){
  let v = (+slider.value)+delta;
  const min=+slider.min, max=+slider.max;
  if(slider===aimSlider){ if(v>max) v-=(max-min); if(v<min) v+=(max-min); } // 360deg wraps
  else v = Math.max(min, Math.min(max, v));
  slider.value = v;
  handler();
}
aimSlider.addEventListener('input', onAimChange);
powSlider.addEventListener('input', onPowChange);
document.getElementById('aimDown').addEventListener('click', ()=>step(aimSlider,-5,onAimChange));
document.getElementById('aimUp').addEventListener('click', ()=>step(aimSlider, 5,onAimChange));
document.getElementById('powDown').addEventListener('click', ()=>step(powSlider,-5,onPowChange));
document.getElementById('powUp').addEventListener('click', ()=>step(powSlider, 5,onPowChange));
shootBtn.addEventListener('click', shoot);

function shoot(){
  if(game.live || shootBtn.disabled) return;
  const v=launchVector(); const b=game.ball;
  b.vx=v[0]; b.vy=v[1]; b.vz=v[2]; b._pn=undefined;
  game.live=true; game.attempts++; game.preview=null; game.previewLand=null;
  shootBtn.disabled=true;
  syncHUD();
}
function syncHUD(){
  document.getElementById('scoreN').textContent = game.score;
  document.getElementById('scoreS').textContent = game.makes+' / '+game.attempts;
}

/* ---------------- drawing helpers ---------------- */
function mv(p){ ctx.moveTo(p[0],p[1]); }
function ln(p){ ctx.lineTo(p[0],p[1]); }
function polyPath(pts){ ctx.beginPath(); mv(pts[0]); for(let i=1;i<pts.length;i++) ln(pts[i]); ctx.closePath(); }
function fillOnly(pts,fill){ polyPath(pts); ctx.fillStyle=fill; ctx.fill(); }
function strokePts(pts,color,lw){
  ctx.beginPath(); mv(pts[0]); for(let i=1;i<pts.length;i++) ln(pts[i]);
  ctx.strokeStyle=color; ctx.lineWidth=lw; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.stroke();
}

/* ---------------- background: navy infinite canvas + lattice + sun glow ---------------- */
function drawBackground(){
  ctx.fillStyle=COL.bg; ctx.fillRect(0,0,W,H);
  const g = ctx.createRadialGradient(W*0.86,H*0.1,0, W*0.86,H*0.1, Math.max(W,H)*0.95);
  g.addColorStop(0, COL.sun); g.addColorStop(1,'rgba(255,196,102,0)');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  ctx.strokeStyle=COL.grid; ctx.lineWidth=1.2;
  const step=10, ext=140;
  const ox = focus.x - (focus.x%step), oy = focus.y - (focus.y%step);
  ctx.beginPath();
  for(let x=-ext;x<=ext;x+=step){ const wx=ox+x; const a=proj(wx,oy-ext,0), b=proj(wx,oy+ext,0); mv(a); ln(b); }
  for(let y=-ext;y<=ext;y+=step){ const wy=oy+y; const a=proj(ox-ext,wy,0), b=proj(ox+ext,wy,0); mv(a); ln(b); }
  ctx.stroke();
}

/* ---------------- hoop: real rim hole, sorted net, no shadow/stroke chrome ---------------- */
function netStrandsSplit(){
  const back=[], front=[];
  const N=14;
  for(let i=0;i<N;i++){
    const a=i/N*Math.PI*2;
    const p=rimPoint(a);
    const q=rimPoint(a+Math.PI*2/N*0.5);
    const mid = Math.sin(a); // local-v component: negative side faces the camera
    const seg = {p, bottom:[hoop.cx+(q[0]-hoop.cx)*0.5, hoop.cy+(q[1]-hoop.cy)*0.5, p[2]-2.4]};
    (mid<0 ? front : back).push(seg);
  }
  return {front,back};
}
function drawNetStrands(list){
  if(!list.length) return;
  ctx.strokeStyle=COL.net; ctx.lineWidth=1.6; ctx.beginPath();
  for(const seg of list){ mv(proj(seg.p[0],seg.p[1],seg.p[2])); ln(proj(seg.bottom[0],seg.bottom[1],seg.bottom[2])); }
  ctx.stroke();
  ctx.beginPath();
  const n=list.length;
  for(let i=0;i<n;i++){
    const a=list[i], bnext=list[(i+1)%n];
    const t=0.55;
    const pa=[a.p[0]+(a.bottom[0]-a.p[0])*t, a.p[1]+(a.bottom[1]-a.p[1])*t, a.p[2]+(a.bottom[2]-a.p[2])*t];
    const pb=[bnext.p[0]+(bnext.bottom[0]-bnext.p[0])*t, bnext.p[1]+(bnext.bottom[1]-bnext.p[1])*t, bnext.p[2]+(bnext.bottom[2]-bnext.p[2])*t];
    mv(proj(pa[0],pa[1],pa[2])); ln(proj(pb[0],pb[1],pb[2]));
  }
  ctx.stroke();
}
function drawRimAndBackboard(pre){
  const post = proj(hoop.cx, hoop.cy-BB_OFF-1.4, 0);
  const postTop = proj(hoop.cx, hoop.cy-BB_OFF-1.4, RIM_Z+BB_H);
  strokePts([post,postTop], COL.board, 8);

  const corner=(u,n)=>{
    const bx=hoop.cx + u*hoop.u[0] + (-BB_OFF)*hoop.v[0] + n*hoop.n[0];
    const by=hoop.cy + u*hoop.u[1] + (-BB_OFF)*hoop.v[1] + n*hoop.n[1];
    const bz=hoop.cz + u*hoop.u[2] + (-BB_OFF)*hoop.v[2] + n*hoop.n[2];
    return proj(bx,by,bz);
  };
  const bb=[corner(-BB_W/2,-0.4),corner(BB_W/2,-0.4),corner(BB_W/2,BB_H),corner(-BB_W/2,BB_H)];
  fillOnly(bb, COL.board);
  const inner=[corner(-1.0,-0.1),corner(1.0,-0.1),corner(1.0,1.5),corner(-1.0,1.5)];
  strokePts([inner[0],inner[1],inner[2],inner[3],inner[0]], COL.boardEdge, 2.5);

  drawNetStrands(pre.back);

  const ring=[]; for(let i=0;i<=40;i++){ const p=rimPoint(i/40*Math.PI*2); ring.push(proj(p[0],p[1],p[2])); }
  strokePts(ring, COL.rimDark, 7);
  strokePts(ring, COL.rim, 4);

  drawNetStrands(pre.front);
}

/* ---------------- ball: real basketball, slow realistic spin, no outline/shadow ---------------- */
function drawBall(){
  const b=game.ball;
  const p=proj(b.x,b.y,b.z), r=Math.max(BALL_R*S*1.6, 10);

  ctx.save();
  ctx.beginPath(); ctx.arc(p[0],p[1],r,0,Math.PI*2); ctx.closePath();
  ctx.clip();
  ctx.fillStyle=COL.ball; ctx.fillRect(p[0]-r,p[1]-r,r*2,r*2);

  // spinning seams: three longitude bands 60deg apart (classic 8-panel
  // basketball layout), each a squashed ellipse whose width follows
  // cos(spin angle) - the standard 2D trick for a rotating sphere.
  ctx.strokeStyle=COL.seam; ctx.lineWidth=Math.max(1.4, r*0.075);
  for(const phase of [b.spinPhaseA, b.spinPhaseB, b.spinPhaseC]){
    const k=Math.cos(b.spinAngle+phase);
    ctx.beginPath();
    ctx.ellipse(p[0],p[1], Math.abs(k)*r, r, 0,0,Math.PI*2);
    ctx.stroke();
  }
  ctx.beginPath();
  ctx.ellipse(p[0],p[1], r, r*0.26, 0,0,Math.PI*2);
  ctx.stroke();

  ctx.restore();

  // soft highlight, no hard outline
  ctx.save();
  ctx.beginPath();
  ctx.arc(p[0]-r*0.3, p[1]-r*0.35, r*0.2, 0, Math.PI*2);
  ctx.fillStyle='rgba(255,255,255,.55)'; ctx.fill();
  ctx.restore();
}

/* ---------------- aim preview: sparse small dots + landing ring ---------------- */
function drawAim(){
  if(game.live || game.power<=0.01) return;
  const pts=game.preview;
  if(!pts||!pts.length) return;
  const n=Math.max(3,Math.floor(pts.length*0.45));
  for(let i=0;i<n;i++){
    const t=i/n, q=proj(pts[i][0],pts[i][1],pts[i][2]);
    ctx.globalAlpha=(1-t*0.8)*0.8;
    ctx.beginPath(); ctx.arc(q[0],q[1], 2.4-1.0*t,0,Math.PI*2);
    ctx.fillStyle=COL.net; ctx.fill();
  }
  ctx.globalAlpha=1;
  if(game.previewLand){
    const l=proj(game.previewLand[0],game.previewLand[1],0);
    ctx.save(); ctx.globalAlpha=.85;
    ctx.beginPath();
    ctx.ellipse(l[0],l[1], 1.7*S, 1.7*S*PITCH, 0,0,Math.PI*2);
    ctx.strokeStyle=COL.rim; ctx.lineWidth=3; ctx.setLineDash([7,6]); ctx.stroke();
    ctx.setLineDash([]); ctx.restore();
  }
}
function drawSpawnBadge(){
  if(game.live) return;
  const b=game.ball;
  const p=proj(b.x,b.y,b.z+2.1);
  ctx.beginPath(); ctx.arc(p[0],p[1],13,0,Math.PI*2);
  ctx.fillStyle=COL.board; ctx.fill();
  ctx.fillStyle=COL.rim; ctx.font='900 15px Archivo, sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(game.spawnPts+'', p[0], p[1]+1);
}

let flash=0;
function drawFlash(){
  if(flash<=0) return;
  ctx.save(); ctx.globalAlpha=Math.min(1,flash);
  ctx.fillStyle=COL.rim; ctx.font='900 62px Archivo, sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  const txt='+'+game.spawnPts;
  ctx.fillText(txt, W/2, H*0.30);
  ctx.restore();
}

/* ---------------- loop ---------------- */
let acc=0, last=performance.now();
function frame(now){
  let dt=(now-last)/1000; last=now;
  if(dt>0.25) dt=0.25;
  acc+=dt;
  while(acc>=DT){
    hoopUpdate(DT);
    if(game.live){
      const r=stepBall(game.ball, DT, true);
      if(r==='make' && !game.resetAt){
        game.makes++; game.score+=game.spawnPts; flash=1.1; syncHUD();
        game.resetAt=now+600;
      } else if(r==='rest' && !game.resetAt){
        game.resetAt=now+150;
      }
    }
    acc-=DT;
  }
  if(game.resetAt && now>=game.resetAt) spawnBall();
  if(flash>0) flash-=dt*1.4;

  drawBackground();
  const netPre = netStrandsSplit();
  drawRimAndBackboard(netPre);
  drawAim();
  drawBall();
  drawSpawnBadge();
  drawFlash();
  requestAnimationFrame(frame);
}

/* ---------------- boot ---------------- */
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',()=>setTimeout(resize,150));
window.__iso = {game, hoop, proj, spawnBall, launchVector, stepBall, DT, LAUNCH, MAX_SPEED, currentDir};
resize(); hoopUpdate(0); spawnBall(); syncHUD();
onAimChange(); onPowChange();
requestAnimationFrame(frame);
})();
</script>
